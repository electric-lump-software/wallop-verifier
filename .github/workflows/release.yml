name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release WASM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Check the tagged commit is on wallop_rs main
        run: |
          set -euo pipefail
          TAGGED=$(git rev-parse --verify -q 'HEAD^{commit}' || true)
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ -z "$TAGGED" ]; then
            echo "ERROR: could not read the tagged commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAGGED" refs/remotes/origin/main; then
            echo "ERROR: the tag points at $TAGGED, which is not on wallop_rs main."
            exit 1
          fi
          echo "OK: tagged commit $TAGGED is on wallop_rs main."
      - name: Check the vendored wallop vectors are wallop main's
        env:
          WALLOP_URL: https://github.com/electric-lump-software/wallop.git
        run: |
          # Fails unless the commit the tagged tree pins at vendor/wallop
          # is an ancestor of wallop main and its spec/vectors tree equals
          # the spec/vectors tree at the tip of wallop main.
          set -euo pipefail
          SUB="$GITHUB_WORKSPACE/vendor/wallop"
          PIN=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify -q HEAD:vendor/wallop || true)
          if [ -z "$PIN" ]; then
            echo "ERROR: could not read the vendor/wallop gitlink from the tagged commit."
            exit 1
          fi

          if [ "$(git -C "$SUB" rev-parse --is-shallow-repository)" = true ]; then
            git -C "$SUB" fetch --quiet --no-tags --unshallow "$WALLOP_URL" +refs/heads/main:refs/remotes/wallop-main
          else
            git -C "$SUB" fetch --quiet --no-tags "$WALLOP_URL" +refs/heads/main:refs/remotes/wallop-main
          fi
          if ! git -C "$SUB" cat-file -e "$PIN^{commit}" 2>/dev/null; then
            git -C "$SUB" fetch --quiet --no-tags "$WALLOP_URL" "$PIN" || true
          fi
          if ! git -C "$SUB" cat-file -e "$PIN^{commit}" 2>/dev/null; then
            echo "ERROR: vendor/wallop pins $PIN, which $WALLOP_URL does not have."
            exit 1
          fi

          if ! git -C "$SUB" merge-base --is-ancestor "$PIN" refs/remotes/wallop-main; then
            echo "ERROR: vendor/wallop pins $PIN, which is not on wallop main."
            exit 1
          fi

          PINNED_VECTORS=$(git -C "$SUB" rev-parse --verify -q "$PIN:spec/vectors" || true)
          MAIN_VECTORS=$(git -C "$SUB" rev-parse --verify -q refs/remotes/wallop-main:spec/vectors || true)
          if [ -z "$PINNED_VECTORS" ] || [ -z "$MAIN_VECTORS" ]; then
            echo "ERROR: could not read spec/vectors (pinned: '$PINNED_VECTORS', wallop main: '$MAIN_VECTORS')."
            exit 1
          fi
          if [ "$PINNED_VECTORS" != "$MAIN_VECTORS" ]; then
            echo "ERROR: vendor/wallop's spec/vectors differ from the tip of wallop main."
            echo "  pinned commit $PIN: spec/vectors $PINNED_VECTORS"
            echo "  wallop main tip: spec/vectors $MAIN_VECTORS"
            exit 1
          fi

          echo "OK: vendor/wallop $PIN is on wallop main; spec/vectors $PINNED_VECTORS matches main's tip."
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --features cli
      - run: cargo install wasm-pack
      - run: wasm-pack build --target web --release
      - run: tar czf "wallop-verifier-wasm-$REF_NAME.tar.gz" -C pkg .
        env:
          REF_NAME: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: wallop-verifier-wasm-${{ github.ref_name }}.tar.gz
      - name: Notify wallop repo
        run: |
          gh api repos/electric-lump-software/wallop/dispatches \
            -f event_type=wasm-updated \
            -f "client_payload[version]=$REF_NAME"
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.WALLOP_DISPATCH_TOKEN }}
